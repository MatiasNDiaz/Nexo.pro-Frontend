name: CI

on:
  push:
    branches: [main, 'etapa-*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, tests y e2e
    # Versión fija: con "ubuntu-latest" pasando a Ubuntu 26 (desde el 19/10/2026), `playwright install
    # --with-deps` no encuentra los paquetes de Chromium y la CI falla antes de las pruebas (11/11/2026).
    runs-on: ubuntu-24.04
    env:
      # Valores públicos de prueba: el build de `npm run build` los exige (src/config/env.ts). Ninguno es
      # secreto. Las pruebas e2e compilan con los suyos (playwright.config.ts).
      NEXT_PUBLIC_API_URL: http://localhost:3199
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      # Playwright compila y levanta `next start` (playwright.config.ts → webServer).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
